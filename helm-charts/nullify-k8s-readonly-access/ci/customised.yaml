# Every optional value set, with both sensitive kinds withheld.
groupName: acme-nullify-readonly
clusterRoleName: acme-nullify-readonly
clusterRoleBindingName: acme-nullify-readonly
grantSecretsRead: false
grantConfigMapsRead: false
extraSubjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: nullify-scanner
extraRules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list"]
labels:
  team: platform
annotations:
  example.com/owner: platform
