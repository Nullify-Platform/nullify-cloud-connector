# Default values for nullify-k8s-collector
# This is a YAML-formatted file.
#
# REQUIRED VALUES (the chart refuses to render without them):
#   - collector.clusterName: Your exact cluster name
#   - collector.s3.bucket: S3 bucket from Nullify configure page
#   - collector.kms.keyArn: KMS key ARN (not an alias) from Nullify configure page
#
# Provider-specific required values:
#   - EKS: serviceAccount.annotations."eks.amazonaws.com/role-arn"
#          (IAM role ARN from Nullify configure page)
#   - GKE: collector.gke.awsRoleArn
#          (Nullify-owned federated AWS IAM role ARN, provided by Nullify
#           after you register your cluster's OIDC issuer URL)
#          serviceAccount.annotations."iam.gke.io/gcp-service-account"
#          (Your GCP service account email, bound to the in-cluster
#           ServiceAccount via Workload Identity)
#
# The chart does not create its namespace. Install with
#   helm upgrade --install nullify-k8s-collector nullify/nullify-k8s-collector \
#     --namespace nullify --create-namespace -f values.yaml

# Which cluster platform the collector is running on.
# Supported values: "aws" (EKS, default) | "gcp" (GKE).
# - "aws" authenticates via IRSA (service account → AWS IAM role).
# - "gcp" authenticates via GKE Workload Identity → sts:AssumeRoleWithWebIdentity.
cloudProvider: aws

# Cluster-level permissions
clusterRole:
    create: true
    name: nullify-k8s-collector-role
clusterRoleBinding:
    create: true
    name: nullify-k8s-collector-binding

# Main collector configuration
collector:
    enabled: true

    # Region of the Nullify S3 bucket (NOT your cluster's region). S3 only
    # accepts a KMS key from the bucket's region, so leave this empty to use
    # the region in collector.kms.keyArn; any other value is rejected.
    aws:
        region: ""

    # Must match your actual cluster name exactly
    clusterName: ""

    # Container image. Pin a versioned tag instead of k8s-collector-latest once
    # Nullify publishes one.
    image:
        repository: public.ecr.aws/w4o2j2x4/integrations
        tag: k8s-collector-latest
        pullPolicy: Always

    # Resource limits
    resources:
        limits:
            cpu: 200m
            memory: 256Mi
        requests:
            cpu: 100m
            memory: 128Mi

    # S3 configuration (from Nullify configure page)
    s3:
        bucket: ""
        keyPrefix: k8s-collector

    # KMS key ARN from the Nullify configure page:
    # arn:aws:kms:<region>:<account-id>:key/<key-id>. An alias does not work.
    kms:
        keyArn: ""

    # Debug logging
    debug:
        enabled: false

    # CronJob schedule (daily at midnight UTC)
    schedule: "0 0 * * *"

    # Security context
    securityContext:
        allowPrivilegeEscalation: false
        capabilities:
            drop:
                - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true

    # GKE-specific settings (only used when cloudProvider is "gcp").
    gke:
        # Nullify-owned federated AWS IAM role the collector assumes via
        # sts:AssumeRoleWithWebIdentity. Supplied by Nullify after you
        # register your cluster's OIDC issuer URL during onboarding.
        awsRoleArn: ""
        # Deprecated: use awsRoleArn instead. Kept for backwards compat.
        nullifyAwsRoleArn: ""

        # Audience the projected GCP service-account token is minted with.
        # AWS STS requires this to match the OIDC provider's client_id_list;
        # "sts.amazonaws.com" is correct for all Nullify deployments and
        # should not normally be changed.
        audience: sts.amazonaws.com

        # Path inside the pod where the Workload-Identity-projected token
        # is mounted. The collector reads this file and forwards the token
        # to AWS STS. Must match the `AWS_WEB_IDENTITY_TOKEN_FILE` env var.
        webIdentityTokenPath: /var/run/secrets/tokens/gcp-sa-token

# Helm chart naming
fullnameOverride: ""
nameOverride: ""

# Labels for all resources
labels: {}

# Node selector
nodeSelector: {}

# Service account annotations.
#
# The chart picks the right annotation based on `cloudProvider`:
#   - aws: expects `eks.amazonaws.com/role-arn` (IRSA)
#   - gcp: expects `iam.gke.io/gcp-service-account` (Workload Identity)
#
# Leave the other provider's annotation unset; the chart renders only the
# one that applies. Extra annotations are passed through unchanged.
serviceAccount:
    annotations:
        # Required when cloudProvider=aws (EKS). IAM role ARN from the Nullify
        # configure page: arn:aws:iam::<account-id>:role/AWSIntegration-<CustomerName>-NullifyReadOnlyRole
        eks.amazonaws.com/role-arn: ""
        # Used when cloudProvider=gcp (GKE). Your GCP service account email,
        # e.g. nullify-k8s-collector@your-project.iam.gserviceaccount.com.
        # iam.gke.io/gcp-service-account: "YOUR-GCP-SA-EMAIL"
    create: true
    # Keep the default name and namespace on EKS: the connector's CloudFormation
    # IRSA trust only allows system:serviceaccount:nullify:nullify-k8s-collector-sa.
    name: nullify-k8s-collector-sa
    # Namespace for every namespaced object. It must already exist (use
    # --create-namespace). Empty means the release namespace.
    namespace: nullify

# Pod tolerations
tolerations: []
