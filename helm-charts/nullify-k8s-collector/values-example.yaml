# Example values for nullify-k8s-collector
# Copy this file to values-production.yaml and fill in your actual values
# DO NOT commit values-production.yaml to version control
#
# Install with:
#   helm upgrade --install nullify-k8s-collector nullify/nullify-k8s-collector \
#     --namespace nullify --create-namespace -f values-production.yaml
#
# The file below shows the EKS (IRSA) setup. See the bottom of this file
# for the equivalent GKE (Workload Identity) setup.
#
# REQUIRED VALUES (get these from Nullify configure page):
#   - collector.clusterName: Your exact cluster name
#   - collector.s3.bucket: S3 bucket name
#   - collector.kms.keyArn: KMS key ARN (not an alias)
#   - EKS only: serviceAccount.annotations."eks.amazonaws.com/role-arn"
#   - GKE only: collector.gke.awsRoleArn

cloudProvider: aws

collector:
  # Region of the Nullify S3 bucket, not your cluster's. Optional: defaults to
  # the region in collector.kms.keyArn, and any other value is rejected.
  # aws:
  #   region: "us-west-2"

  # Must match your actual EKS cluster name exactly
  clusterName: "my-production-cluster"

  # S3 configuration (from Nullify configure page)
  s3:
    bucket: "your-nullify-bucket"
    keyPrefix: "k8s-collector"

  # KMS configuration (from Nullify configure page)
  kms:
    keyArn: "arn:aws:kms:us-west-2:123456789012:key/your-key-id"

  # Debug logging (optional)
  debug:
    enabled: false

  # Collection schedule (optional, default: daily at midnight)
  schedule: "0 2 * * *"

  # Resource limits (optional)
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

# Service account with IRSA (from Nullify configure page)
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/AWSIntegration-yourcompany-NullifyReadOnlyRole"

# Node placement (optional)
nodeSelector:
  node-type: "system"

# Tolerations (optional)
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "system"
    effect: "NoSchedule"

# Additional labels (optional)
labels:
  environment: "production"

# ---------------------------------------------------------------------------
# GKE (Workload Identity) example
# ---------------------------------------------------------------------------
# Replace the section above with the block below for a GKE deployment.
# See README.md for one-time onboarding steps (creating the GCP service
# account, sharing its uniqueId with Nullify, and binding it to the
# in-cluster ServiceAccount via Workload Identity).
#
# cloudProvider: gcp
#
# collector:
#   clusterName: "my-gke-cluster"
#   s3:
#     bucket: "your-nullify-bucket"
#     keyPrefix: "k8s-collector"
#   kms:
#     keyArn: "arn:aws:kms:us-east-1:123456789012:key/your-key-id"
#   gke:
#     # Provided by Nullify after you register your cluster's OIDC issuer URL.
#     awsRoleArn: "arn:aws:iam::123456789012:role/NullifyK8sCollectorRole"
