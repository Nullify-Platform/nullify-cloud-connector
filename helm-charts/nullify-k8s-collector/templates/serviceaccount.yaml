{{- if .Values.serviceAccount.create -}}
{{- $provider := .Values.cloudProvider | default "aws" -}}
{{- $values := .Values.serviceAccount.annotations | default dict -}}
{{- if eq $provider "aws" -}}
{{- $roleArn := index $values "eks.amazonaws.com/role-arn" | default "" | toString -}}
{{- if not (regexMatch "^arn:aws:iam::[0-9]{12}:role/.+" $roleArn) -}}
{{- fail (printf "serviceAccount.annotations.\"eks.amazonaws.com/role-arn\" must be the IAM role ARN from the Nullify configure page (arn:aws:iam::<account-id>:role/AWSIntegration-<CustomerName>-NullifyReadOnlyRole), got %q" $roleArn) -}}
{{- end -}}
{{- end -}}
{{- $annotations := dict -}}
{{- range $k, $v := $values -}}
  {{- if eq $k "eks.amazonaws.com/role-arn" -}}
    {{- if eq $provider "aws" -}}
      {{- $_ := set $annotations $k $v -}}
    {{- end -}}
  {{- else if eq $k "iam.gke.io/gcp-service-account" -}}
    {{- if eq $provider "gcp" -}}
      {{- $_ := set $annotations $k $v -}}
    {{- end -}}
  {{- else -}}
    {{- $_ := set $annotations $k $v -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-collector.serviceAccountName" . }}
  namespace: {{ include "k8s-collector.namespace" . }}
  labels:
    {{- include "k8s-collector.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
