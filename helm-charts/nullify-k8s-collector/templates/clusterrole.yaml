{{- if .Values.clusterRole.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.clusterRole.name }}
  labels:
    {{- include "k8s-collector.labels" . | nindent 4 }}
rules:
  # Kinds the collector lists, kept identical to the managed-scan ClusterRole
  # (modules/k8s-resources/managed_scan.tf) and to collect.go in the platform
  # monorepo (context/internal/cloudintegrations/k8sintegration/collect).
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "persistentvolumes", "persistentvolumeclaims", "configmaps", "secrets", "resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list"]
{{- end }} 