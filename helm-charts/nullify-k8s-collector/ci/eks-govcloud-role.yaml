# EKS in the aws-us-gov partition: the role-arn guard accepts non-commercial partitions.
cloudProvider: aws
collector:
  clusterName: example-eks-cluster
  s3:
    bucket: example-nullify-bucket
  kms:
    keyArn: arn:aws:kms:us-east-2:123456789012:key/00000000-0000-0000-0000-000000000000
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws-us-gov:iam::123456789012:role/AWSIntegration-example-NullifyReadOnlyRole
