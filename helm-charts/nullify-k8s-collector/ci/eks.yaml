# EKS install with every required value; labels exercise the labels helper.
cloudProvider: aws
collector:
  clusterName: example-eks-cluster
  s3:
    bucket: example-nullify-bucket
  kms:
    keyArn: arn:aws:kms:eu-central-1:123456789012:key/00000000-0000-0000-0000-000000000000
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/AWSIntegration-example-NullifyReadOnlyRole
labels:
  environment: ci
nodeSelector:
  node-type: system
