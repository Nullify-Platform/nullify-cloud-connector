name: Terraform validate

# Lints and validates the customer-facing Terraform modules so a regression
# in gcp-integration-setup, aws-integration-setup, or azure-integration-setup
# gets caught in CI rather than at customer apply time. The historical incident
# this is meant to prevent: a project-scoped custom role bound at the org level
# (#40) that only blew up when a customer ran terraform apply.

on:
  pull_request:
    paths:
      - "gcp-integration-setup/**"
      - "aws-integration-setup/**"
      - "azure-integration-setup/**"
      - "scripts/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches:
      - main
    paths:
      - "gcp-integration-setup/**"
      - "aws-integration-setup/**"
      - "azure-integration-setup/**"
      - "scripts/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: terraform (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # AWS rows run the declared floor (Terraform 1.8, the version the
        # terraform-test job also runs); examples that use ephemeral resources
        # (v6 multi-cluster, v6 managed-scan) need 1.10. The three modules/
        # directories each tree has are covered by the terraform-test job
        # below instead, which already runs fmt-check, init and validate (via
        # terraform test) against both Terraform versions with mocked values.
        include:
          - directory: gcp-integration-setup/terraform
            terraform: 1.9.5
          - directory: gcp-integration-setup/terraform/examples/organization
            terraform: 1.9.5
          - directory: gcp-integration-setup/terraform/examples/folder
            terraform: 1.9.5
          - directory: gcp-integration-setup/terraform/examples/single-project
            terraform: 1.9.5
          - directory: aws-integration-setup/terraform
            terraform: 1.8.5
          - directory: aws-integration-setup/terraform/examples/basic
            terraform: 1.8.5
          - directory: aws-integration-setup/terraform/examples/multi-cluster-complete
            terraform: 1.8.5
          - directory: aws-integration-setup/terraform/examples/managed-scan
            terraform: 1.8.5
          - directory: aws-integration-setup/terraform-v6
            terraform: 1.8.5
          - directory: aws-integration-setup/terraform-v6/examples/basic
            terraform: 1.8.5
          - directory: aws-integration-setup/terraform-v6/examples/multi-cluster-complete
            terraform: 1.10.5
          - directory: aws-integration-setup/terraform-v6/examples/managed-scan
            terraform: 1.10.5
          - directory: azure-integration-setup/terraform
            terraform: 1.9.5
          - directory: azure-integration-setup/terraform/examples/management-group
            terraform: 1.9.5
          - directory: azure-integration-setup/terraform/examples/subscriptions
            terraform: 1.9.5
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: terraform init -backend=false
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  # Module logic (preconditions, checks, RBAC rules, KMS grants) against mocked
  # providers. No cloud credentials are used. 1.8.5 is the declared floor and
  # the lowest version that runs this suite (mock_provider is 1.7+, strcontains
  # in the tests is 1.8+), so every module is exercised at the floor it
  # advertises as well as at 1.10.5.
  terraform-test:
    name: terraform test (${{ matrix.directory }}, tf ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - 1.8.5
          - 1.10.5
        directory:
          - aws-integration-setup/terraform/modules/eks-managed-scan-access
          - aws-integration-setup/terraform/modules/k8s-resources
          - aws-integration-setup/terraform/modules/nullify-aws-integration
          - aws-integration-setup/terraform-v6/modules/eks-managed-scan-access
          - aws-integration-setup/terraform-v6/modules/k8s-resources
          - aws-integration-setup/terraform-v6/modules/nullify-aws-integration
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: terraform fmt -check (including test files)
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: terraform init -backend=false
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: terraform test
        working-directory: ${{ matrix.directory }}
        run: terraform test

  # The CloudFormation template and both Terraform trees grant the same
  # customer role from three independently maintained templates. Nothing
  # else checks that their Allow/Deny action sets stay identical (ncc #58,
  # W58-3).
  iam-policy-drift:
    name: IAM policy drift (CloudFormation vs Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compare Allow/Deny action sets
        run: python3 scripts/check_iam_policy_drift.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install + run
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck gcp-integration-setup/scripts/install.sh
          shellcheck gcp-integration-setup/scripts/uninstall.sh
