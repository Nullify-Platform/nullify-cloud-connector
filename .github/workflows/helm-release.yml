name: Release Helm Chart

on:
  push:
    branches: [ main ]
    paths:
      - 'helm-charts/**'
      - '.github/workflows/helm-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0

    - name: Get Chart Version
      id: version
      run: |
        VERSION=$(grep '^version:' helm-charts/nullify-k8s-collector/Chart.yaml | awk '{print $2}' | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using Chart.yaml version: $VERSION"

    # This job rebuilds the whole Pages site from this one chart, so deploying
    # it drops every other version the live index serves. The publish rework
    # (PR #65 -> #70 -> #75) replaces this workflow with one that keeps them;
    # until that is on main, fail here rather than unpublish.
    - name: Refuse to unpublish versions the live index serves
      env:
        VERSION: ${{ steps.version.outputs.version }}
        INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.yaml
      run: |
        index="$(mktemp)"
        status="$(curl -sSL -o "$index" -w '%{http_code}' "$INDEX_URL")"
        case "$status" in
          200) ;;
          404) echo "no published index yet"; exit 0 ;;
          *) echo "::error::fetching $INDEX_URL returned HTTP $status"; exit 1 ;;
        esac
        published="$(grep -oE '[A-Za-z0-9_.-]+-[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9_.+-]*\.tgz' "$index" | sort -u || true)"
        dropped="$(printf '%s\n' "$published" | grep -v '^$' | grep -vxF "nullify-k8s-collector-${VERSION}.tgz" || true)"
        if [ -n "$dropped" ]; then
          echo "::error::deploying would unpublish: $(echo $dropped). Merge the Helm publish rework (PR #65 -> #70 -> #75) to main first; its workflow republishes every version."
          exit 1
        fi
        echo "the live index serves only nullify-k8s-collector-${VERSION}.tgz or nothing"

    - name: Add Helm repos (if chart has dependencies)
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami || true
        helm repo update || true

    - name: Package Helm Chart
      run: |
        # Create docs directory if it doesn't exist
        mkdir -p docs
        
        # Package the chart
        helm package helm-charts/nullify-k8s-collector -d docs/
        
        # Generate/update the index
        helm repo index docs/ --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0

    - name: Validate Helm Chart
      run: |
        helm lint helm-charts/nullify-k8s-collector
        helm template helm-charts/nullify-k8s-collector --debug
