# What `helm upgrade --reuse-values` hands 0.4.0 from a 0.2.0 install: 0.2.0's
# defaults (collector.aws.region us-east-1, namespace.create) plus the user's values.
# expect: upgrade with --reset-then-reuse-values
namespace:
  create: true
collector:
  aws:
    region: us-east-1
  clusterName: example-eks-cluster
  s3:
    bucket: example-nullify-bucket
  kms:
    keyArn: arn:aws:kms:ap-southeast-2:123456789012:key/00000000-0000-0000-0000-000000000000
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/AWSIntegration-example-NullifyReadOnlyRole
